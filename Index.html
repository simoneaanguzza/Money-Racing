<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#0a0a0a"/>
<title>WealthPilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
/* ── Variables ── */
:root {
  --bg:        #080808;
  --s1:        #111111;
  --s2:        #181818;
  --s3:        #202020;
  --s4:        #282828;
  --b1:        #2a2a2a;
  --b2:        #363636;
  --b3:        #444444;
  --gold:      #c9a84c;
  --gold2:     #e8c96a;
  --gold3:     #f0dfa8;
  --gd:        rgba(201,168,76,.14);
  --gb:        rgba(201,168,76,.4);
  --t1:        #ebe9e3;
  --t2:        #9b968f;
  --t3:        #575350;
  --green:     #4caf7d;
  --gn:        rgba(76,175,125,.15);
  --red:       #e05c5c;
  --rn:        rgba(224,92,92,.15);
  --amber:     #e8a44a;
  --blue:      #5b8dee;
  --r:         10px;
  --rl:        14px;
}

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--t1);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  line-height: 1.6;
}
h1,h2,h3,.syne { font-family: 'Syne', sans-serif; }
.mono { font-family: 'JetBrains Mono', monospace; }

/* ═══ TOP NAV ═══ */
#topnav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 56px;
  background: var(--s1);
  border-bottom: 1px solid var(--b1);
  display: flex;
  align-items: center;
  gap: 0;
  z-index: 100;
  padding: 0 16px;
}

/* Logo */
.nav-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-right: 20px;
  border-right: 1px solid var(--b1);
  margin-right: 8px;
  flex-shrink: 0;
}
.nav-logo-icon {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Syne', sans-serif;
  font-weight: 800; font-size: 13px; color: #000;
  box-shadow: 0 0 12px rgba(201,168,76,.3);
  flex-shrink: 0;
}
.nav-logo-text {
  font-family: 'Syne', sans-serif;
  font-weight: 700; font-size: 14px;
  color: var(--gold2);
  letter-spacing: .5px;
  white-space: nowrap;
}

/* Nav links */
.nav-links {
  display: flex;
  align-items: center;
  gap: 2px;
  flex: 1;
  overflow-x: auto;
  scrollbar-width: none;
}
.nav-links::-webkit-scrollbar { display: none; }

.nav-link {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  color: var(--t3);
  font-size: 13px;
  font-weight: 400;
  white-space: nowrap;
  transition: all .15s;
  border: 1px solid transparent;
  flex-shrink: 0;
}
.nav-link:hover {
  color: var(--t2);
  background: var(--s2);
}
.nav-link.active {
  color: var(--gold2);
  background: var(--gd);
  border-color: var(--gb);
  font-weight: 500;
}
.nav-link .nl-icon { font-size: 13px; opacity: .8; }
.nav-link.active .nl-icon { opacity: 1; }

/* Nav group label */
.nav-sep {
  width: 1px; height: 20px;
  background: var(--b1);
  margin: 0 6px;
  flex-shrink: 0;
}
.nav-group-lbl {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1.2px;
  color: var(--t3);
  text-transform: uppercase;
  padding: 0 6px;
  flex-shrink: 0;
}

/* Topbar right */
.nav-right {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-left: 12px;
  border-left: 1px solid var(--b1);
  margin-left: 8px;
  flex-shrink: 0;
}
.nav-page-title {
  font-family: 'Syne', sans-serif;
  font-weight: 600;
  font-size: 13px;
  color: var(--t1);
}

/* ═══ MOBILE BOTTOM NAV ═══ */
#bottomnav {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 62px;
  background: var(--s1);
  border-top: 1px solid var(--b2);
  z-index: 100;
}
.bn-inner {
  display: flex;
  align-items: stretch;
  height: 100%;
}
.bn-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  cursor: pointer;
  color: var(--t3);
  transition: color .15s;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: .3px;
  padding: 6px 4px;
  border-top: 2px solid transparent;
}
.bn-item.active {
  color: var(--gold2);
  border-top-color: var(--gold);
}
.bn-item .bn-icon { font-size: 19px; line-height: 1; }

/* ═══ MAIN CONTENT ═══ */
#main {
  position: fixed;
  top: 56px; left: 0; right: 0; bottom: 0;
  overflow-y: auto;
  background: var(--bg);
  scrollbar-width: thin;
  scrollbar-color: var(--b2) transparent;
}
#content {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px;
}
#topbar-actions {
  position: fixed;
  top: 0; right: 16px;
  height: 56px;
  display: flex;
  align-items: center;
  gap: 8px;
  z-index: 101;
}

/* ═══ COMPONENTS ═══ */

/* Cards */
.card {
  background: var(--s1);
  border: 1px solid var(--b1);
  border-radius: var(--rl);
  padding: 20px;
}
.card + .card { margin-top: 16px; }
.card-hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.card-title {
  font-family: 'Syne', sans-serif;
  font-weight: 600;
  font-size: 14px;
  color: var(--t1);
}
.card-sub { font-size: 12px; color: var(--t3); margin-top: 2px; }

/* Grid */
.g4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 16px; }
.g3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 16px; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.g1 { margin-bottom: 16px; }

/* Metric cards */
.mc {
  background: var(--s2);
  border: 1px solid var(--b1);
  border-radius: var(--r);
  padding: 16px 18px;
  position: relative;
  overflow: hidden;
}
.mc.gold {
  border-color: var(--gb);
  background: linear-gradient(135deg, rgba(201,168,76,.1), rgba(201,168,76,.04));
}
.mc .ml { font-size: 11px; color: var(--t3); letter-spacing: .6px; text-transform: uppercase; font-weight: 500; margin-bottom: 7px; }
.mc .mv { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 500; color: var(--t1); line-height: 1.1; }
.mc .mv.g { color: var(--green); }
.mc .mv.r { color: var(--red); }
.mc .mv.au { color: var(--gold2); }
.mc .ms { font-size: 11px; color: var(--t3); margin-top: 4px; }
.mc .ms .p { color: var(--green); }
.mc .ms .n { color: var(--red); }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px;
  border-radius: 8px;
  font-size: 12.5px; font-weight: 500;
  cursor: pointer;
  transition: all .15s;
  border: none;
  font-family: 'DM Sans', sans-serif;
  white-space: nowrap;
}
.btn-gold { background: linear-gradient(135deg,var(--gold),var(--gold2)); color: #000; font-weight: 600; }
.btn-gold:hover { opacity: .88; transform: translateY(-1px); }
.btn-ghost { background: transparent; border: 1px solid var(--b2); color: var(--t2); }
.btn-ghost:hover { background: var(--s3); color: var(--t1); }
.btn-sm { padding: 5px 11px; font-size: 12px; }

/* Table */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: 9px 12px; font-size: 10.5px; font-weight: 600; letter-spacing: .8px; color: var(--t3); border-bottom: 1px solid var(--b1); text-transform: uppercase; }
td { padding: 11px 12px; font-size: 13px; border-bottom: 1px solid var(--b1); color: var(--t1); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--s2); }
.tm { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; }

/* Badges */
.badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; }
.bg  { background: var(--gn); color: var(--green); border: 1px solid rgba(76,175,125,.25); }
.br  { background: var(--rn); color: var(--red); border: 1px solid rgba(224,92,92,.25); }
.bau { background: var(--gd); color: var(--gold2); border: 1px solid var(--gb); }
.bb  { background: rgba(91,141,238,.12); color: var(--blue); border: 1px solid rgba(91,141,238,.25); }
.bgr { background: var(--s3); color: var(--t2); border: 1px solid var(--b1); }

/* Progress */
.pw { height: 5px; background: var(--s3); border-radius: 3px; overflow: hidden; }
.pw.h8 { height: 8px; }
.pb { height: 100%; border-radius: 3px; transition: width .4s ease; }
.pb-g { background: var(--green); }
.pb-r { background: var(--red); }
.pb-au { background: linear-gradient(90deg, var(--gold), var(--gold2)); }

/* Modal */
.mbg {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.8);
  z-index: 200;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  backdrop-filter: blur(6px);
}
.modal {
  background: var(--s1);
  border: 1px solid var(--b2);
  border-radius: 16px;
  padding: 28px;
  width: 100%; max-width: 520px;
  max-height: 90vh; overflow-y: auto;
  box-shadow: 0 8px 40px rgba(0,0,0,.8);
}
.modal-title {
  font-family: 'Syne', sans-serif;
  font-weight: 700; font-size: 17px;
  color: var(--gold2);
  margin-bottom: 20px;
}
.mf { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--b1); }

/* Form */
.fg { display: grid; gap: 13px; }
.fg2 { grid-template-columns: 1fr 1fr; }
.fg3 { grid-template-columns: 1fr 1fr 1fr; }
.fl { font-size: 11.5px; font-weight: 500; color: var(--t2); display: block; margin-bottom: 5px; }
.fl.g { color: var(--green); }
.fl.r { color: var(--red); }
.fi {
  background: var(--s2);
  border: 1px solid var(--b2);
  border-radius: 8px;
  color: var(--t1);
  font-size: 13px;
  padding: 8px 11px;
  font-family: 'DM Sans', sans-serif;
  width: 100%;
  transition: border-color .15s;
}
.fi:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,168,76,.12); }
select.fi option { background: var(--s2); }
textarea.fi { resize: vertical; min-height: 68px; }

/* RR preview */
.rr-box { padding: 9px 13px; border-radius: 8px; font-size: 12.5px; display: flex; align-items: center; gap: 7px; }
.rr-ok { background: var(--gn); border: 1px solid rgba(76,175,125,.25); color: var(--green); }
.rr-warn { background: rgba(232,164,74,.1); border: 1px solid rgba(232,164,74,.3); color: var(--amber); }

/* Checklist */
.ck-list { display: flex; flex-direction: column; gap: 6px; }
.ck-item {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 10px; border-radius: 8px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all .15s;
}
.ck-item:hover { background: var(--s2); border-color: var(--b1); }
.ck-item.on { background: var(--gn); border-color: rgba(76,175,125,.2); }
.ck-box {
  width: 17px; height: 17px; border-radius: 4px;
  border: 1.5px solid var(--b2);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 10px;
  background: var(--s3);
  transition: all .15s;
}
.ck-item.on .ck-box { background: var(--green); border-color: var(--green); color: #fff; }
.ck-text { font-size: 12.5px; color: var(--t2); }
.ck-item.on .ck-text { color: var(--t1); }

/* Alert */
.al { display: flex; align-items: center; gap: 9px; padding: 10px 14px; border-radius: 9px; font-size: 13px; margin-bottom: 12px; }
.al-w { background: rgba(232,164,74,.1); border: 1px solid rgba(232,164,74,.25); color: var(--amber); }
.al-d { background: var(--rn); border: 1px solid rgba(224,92,92,.3); color: var(--red); }
.al-s { background: var(--gn); border: 1px solid rgba(76,175,125,.25); color: var(--green); }

/* Timeline */
.tl { display: flex; flex-direction: column; gap: 6px; }
.tl-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px; border-radius: 10px;
  border: 1px solid var(--b1);
  background: var(--s2);
  transition: all .15s;
}
.tl-row.cur { border-color: var(--gb); background: var(--gd); }
.tl-row.done { opacity: .65; }
.tl-row.lock { opacity: .4; }
.tl-n {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; flex-shrink: 0;
  font-family: 'Syne', sans-serif;
}
.tl-n.cur { background: linear-gradient(135deg,var(--gold),var(--gold2)); color: #000; }
.tl-n.done { background: var(--gn); color: var(--green); border: 1px solid rgba(76,175,125,.3); }
.tl-n.lock { background: var(--s3); color: var(--t3); }
.tl-info { flex: 1; min-width: 0; }
.tl-ph { font-size: 13px; font-weight: 500; color: var(--t1); }
.tl-row.cur .tl-ph { color: var(--gold2); }
.tl-rules { font-size: 11px; color: var(--t3); margin-top: 1px; }
.tl-cap { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--t2); flex-shrink: 0; }
.tl-row.cur .tl-cap { color: var(--gold); }

/* Dots */
.dots { display: flex; gap: 3px; }
.dot { width: 7px; height: 7px; border-radius: 50%; }

/* Empty */
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; gap: 10px; text-align: center; }
.empty-icon { font-size: 32px; opacity: .3; }
.empty-t { font-size: 14px; font-weight: 500; color: var(--t2); }
.empty-s { font-size: 12px; color: var(--t3); }

/* Rule rows */
.rule-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 13px; background: var(--s2); border: 1px solid var(--b1); border-radius: 8px; gap: 12px; }
.rule-icon { font-size: 14px; flex-shrink: 0; }
.rule-txt { font-size: 13px; font-weight: 500; flex: 1; }
.rule-act { font-size: 11.5px; color: var(--t3); text-align: right; flex-shrink: 0; }

/* Page animation */
@keyframes fadein { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
.page { animation: fadein .22s ease; }

/* Scrollbar */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--b2); border-radius: 3px; }

/* chart wrap */
.cw { position: relative; width: 100%; }

/* ═══ RESPONSIVE ═══ */
@media (max-width: 860px) {
  #topnav { overflow-x: auto; }
  .nav-links { gap: 1px; }
  .nav-link { padding: 5px 9px; font-size: 12px; }
  .nav-group-lbl { display: none; }
  .nav-sep { margin: 0 3px; }
  #main { top: 56px; bottom: 62px; }
  #bottomnav { display: block; }
  #topbar-actions { top: auto; bottom: 68px; right: 12px; }
  .g4 { grid-template-columns: 1fr 1fr; }
  .g3 { grid-template-columns: 1fr 1fr; }
  #content { padding: 14px; }
}
@media (max-width: 600px) {
  .g4 { grid-template-columns: 1fr 1fr; }
  .g3 { grid-template-columns: 1fr 1fr; }
  .g2 { grid-template-columns: 1fr; }
  .fg2 { grid-template-columns: 1fr; }
  .fg3 { grid-template-columns: 1fr; }
  .nav-logo-text { display: none; }
  .nav-logo { padding-right: 12px; margin-right: 4px; }
  .nav-link { padding: 5px 8px; font-size: 11.5px; gap: 4px; }
  .nav-link .nl-txt { display: none; }
  .nav-link .nl-icon { font-size: 16px; }
}
</style>
</head>
<body>

<!-- ═══ TOP NAV ═══ -->
<nav id="topnav">
  <div class="nav-logo">
    <div class="nav-logo-icon">W</div>
    <div class="nav-logo-text">WealthPilot</div>
  </div>

  <div class="nav-links" id="nav-links">
    <div class="nav-link active" data-page="dashboard" onclick="nav('dashboard')">
      <span class="nl-icon">◈</span><span class="nl-txt">Dashboard</span>
    </div>
    <div class="nav-link" data-page="budget" onclick="nav('budget')">
      <span class="nl-icon">◉</span><span class="nl-txt">Budget</span>
    </div>

    <div class="nav-sep"></div>
    <div class="nav-group-lbl">Trading</div>

    <div class="nav-link" data-page="journal" onclick="nav('journal')">
      <span class="nl-icon">◆</span><span class="nl-txt">Journal</span>
    </div>
    <div class="nav-link" data-page="stats" onclick="nav('stats')">
      <span class="nl-icon">◇</span><span class="nl-txt">Statistiche</span>
    </div>
    <div class="nav-link" data-page="scalata" onclick="nav('scalata')">
      <span class="nl-icon">▲</span><span class="nl-txt">Scalata</span>
    </div>

    <div class="nav-sep"></div>
    <div class="nav-group-lbl">Portfolio</div>

    <div class="nav-link" data-page="portfolio" onclick="nav('portfolio')">
      <span class="nl-icon">◑</span><span class="nl-txt">Crypto/Azioni</span>
    </div>
    <div class="nav-link" data-page="accumulo" onclick="nav('accumulo')">
      <span class="nl-icon">◐</span><span class="nl-txt">Accumulo</span>
    </div>
  </div>

  <div class="nav-right" id="nav-right">
    <span class="nav-page-title" id="nav-page-title"></span>
  </div>
</nav>

<!-- ═══ MAIN ═══ -->
<div id="main">
  <div id="content"></div>
</div>

<!-- ═══ TOPBAR ACTIONS (floating) ═══ -->
<div id="topbar-actions"></div>

<!-- ═══ BOTTOM NAV (mobile) ═══ -->
<div id="bottomnav">
  <div class="bn-inner">
    <div class="bn-item active" data-page="dashboard" onclick="nav('dashboard')">
      <div class="bn-icon">◈</div><div>Home</div>
    </div>
    <div class="bn-item" data-page="journal" onclick="nav('journal')">
      <div class="bn-icon">◆</div><div>Journal</div>
    </div>
    <div class="bn-item" data-page="scalata" onclick="nav('scalata')">
      <div class="bn-icon">▲</div><div>Scalata</div>
    </div>
    <div class="bn-item" data-page="portfolio" onclick="nav('portfolio')">
      <div class="bn-icon">◑</div><div>Portfolio</div>
    </div>
    <div class="bn-item" data-page="stats" onclick="nav('stats')">
      <div class="bn-icon">◇</div><div>Stats</div>
    </div>
  </div>
</div>

<!-- ═══ MODAL ROOT ═══ -->
<div id="modal-root"></div>

<script>
/* ────────────────────────────────────────────────────────
   DATA LAYER
──────────────────────────────────────────────────────── */
const DB = {
  get(k){ try{ return JSON.parse(localStorage.getItem('wp3_'+k)||'null'); }catch{ return null; } },
  set(k,v){ localStorage.setItem('wp3_'+k, JSON.stringify(v)); },
  push(k,item){ const a=DB.get(k)||[]; a.push(item); DB.set(k,a); return a; },
  del(k,id){ DB.set(k,(DB.get(k)||[]).filter(x=>x.id!==id)); },
};

const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
const today = () => new Date().toISOString().split('T')[0];
const fmt = (n,d=0) => new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',minimumFractionDigits:d,maximumFractionDigits:d}).format(n||0);
const fmtP = n => (n>=0?'+':'')+n.toFixed(1)+'%';
const fmtN = (n,d=2) => new Intl.NumberFormat('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d}).format(n||0);
const mname = i => ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'][i];

/* ── Seed ── */
function seed(){
  if(DB.get('seeded')) return;
  DB.set('seeded', true);
  DB.set('settings', {initialCapital:3500, targetCapital:35000});
  DB.set('budget_income', 3200);
  DB.set('budget_cats',[
    {id:uid(),name:'Affitto',budget:900,color:'#5b8dee'},

          ${CK_LABELS.map((lbl,i)=>`<div class="ck-item" id="cki${i}" onclick="togCk(${i})">
            <div class="ck-box" id="ckb${i}">✓</div>
            <span class="ck-text">${lbl}</span>
          </div>`).join('')}
        </div>
      </div>

function togCk(i){
  tradeChecklist[i]=!tradeChecklist[i];
  document.getElementById('cki'+i).classList.toggle('on', tradeChecklist[i]);
  const b=document.getElementById('ckb'+i);
  b.style.background=tradeChecklist[i]?'var(--green)':'var(--s3)';
  b.style.borderColor=tradeChecklist[i]?'var(--green)':'var(--b2)';
  const sc=tradeChecklist.filter(Boolean).length;
  const el=document.getElementById('ck-sc');
  el.textContent=sc+'/6';
  el.style.color=sc>=5?'var(--green)':sc>=3?'var(--amber)':'var(--t3)';
}

function updRR(){
  const e=parseFloat(document.getElementById('te')?.value||0);
  const s=parseFloat(document.getElementById('tsl')?.value||0);
  const t=parseFloat(document.getElementById('ttp')?.value||0);
  const el=document.getElementById('rr-p'); if(!el) return;
  if(!e||!s||!t){ el.innerHTML=''; return; }
  const risk=Math.abs(e-s), rew=Math.abs(t-e), rr=risk>0?rew/risk:0;
  el.innerHTML=`<div class="rr-box ${rr>=2?'rr-ok':'rr-warn'}">${rr>=2?'✓':'⚠'} R/R pianificato: <strong>${rr.toFixed(2)}</strong>${rr<2?' — sotto il minimo 1:2':''}</div>`;
}

function saveTrade(){
  const date=document.getElementById('td').value;
  if(!date) return;
  const entry=parseFloat(document.getElementById('te').value)||0;
  const sl=parseFloat(document.getElementById('tsl').value)||0;
  const tp=parseFloat(document.getElementById('ttp').value)||0;
  const risk=Math.abs(entry-sl), rew=Math.abs(tp-entry);
  DB.push('trades',{
    id:uid(), date, direction:document.getElementById('tdir').value,
    wyckoffPhase:document.getElementById('tph').value,
    entry, sl, tp, exit:parseFloat(document.getElementById('tex').value)||0,
    pnl:parseFloat(document.getElementById('tpnl').value)||0,
    rrRealized:risk>0?parseFloat((rew/risk).toFixed(2)):0,
    outcome:document.getElementById('tout').value,
    checklist:[...tradeChecklist],
    notes:document.getElementById('tn').value,
  });
  closeModal(); nav('journal');
}
function delTrade(id){ if(confirm('Eliminare?')){ DB.del('trades',id); nav('journal'); } }

PAGES.stats=function(){
  const trades=DB.get('trades')||[];
  const S=DB.get('settings')||{initialCapital:3500};
  const INIT=S.initialCapital||3500;
  const wins=trades.filter(t=>t.pnl>0);
  const losses=trades.filter(t=>t.pnl<0);
  const wr=trades.length?Math.round(wins.length/trades.length*100):0;
  const avgW=wins.length?wins.reduce((s,t)=>s+t.pnl,0)/wins.length:0;
  const avgL=losses.length?Math.abs(losses.reduce((s,t)=>s+t.pnl,0))/losses.length:0;
  const pf=avgL>0?avgW/avgL:0;
  const avgRR=trades.filter(t=>t.rrRealized>0).length?trades.filter(t=>t.rrRealized>0).reduce((s,t)=>s+t.rrRealized,0)/trades.filter(t=>t.rrRealized>0).length:0;
  const avgCk=trades.length?trades.reduce((s,t)=>s+(t.checklist?t.checklist.filter(Boolean).length:0),0)/trades.length:0;
  const totalPnL=trades.reduce((s,t)=>s+t.pnl,0);

  // Equity & drawdown series
  const sOps=[...trades].sort((a,b)=>a.date.localeCompare(b.date));
  let peak=INIT,eq=INIT,maxDD=0;
  const eqD=[INIT],ddD=[0],labels=['Start'];
  sOps.forEach(t=>{
    eq+=t.pnl; eqD.push(Math.round(eq));
    if(eq>peak)peak=eq;
    const dd=peak>0?(peak-eq)/peak*100:0;
    if(dd>maxDD)maxDD=dd;
    ddD.push(parseFloat(dd.toFixed(2)));
    labels.push(t.date.slice(5));
  });

  // Monthly
  const monthly=Array.from({length:12},(_,i)=>{
    const ops=trades.filter(t=>new Date(t.date).getMonth()===i);
    return{m:mname(i),pnl:Math.round(ops.reduce((s,t)=>s+t.pnl,0)),n:ops.length};
  });

  // Wyckoff
  const phases=['Accumulo','Markup','Distribuzione','Markdown'];
  const wyck=phases.map(ph=>{
    const ops=trades.filter(t=>t.wyckoffPhase===ph);
    return{ph,pnl:Math.round(ops.reduce((s,t)=>s+t.pnl,0)),n:ops.length,wr:ops.length?Math.round(ops.filter(t=>t.pnl>0).length/ops.length*100):0};
  });

  const cm=new Date().getMonth();
  const curP=PLAN[cm]||PLAN[0];

  document.getElementById('content').innerHTML=`<div class="page">
    ${maxDD>=15?`<div class="al al-d">⚠ Drawdown ${maxDD.toFixed(1)}% — supera il 15%: torna alla fase precedente</div>`:''}
    ${wr>0&&wr<55?`<div class="al al-w">Win rate ${wr}% sotto il target del 60%</div>`:''}

    <div class="g4">
      <div class="mc"><div class="ml">Win rate</div><div class="mv ${wr>=60?'g':''}">${wr>0?wr+'%':'—'}</div><div class="ms">Target ≥ 60%</div></div>
      <div class="mc"><div class="ml">Profit factor</div><div class="mv ${pf>=2?'g':''}">${pf>0?pf.toFixed(2):'N/A'}</div><div class="ms">Target ≥ 2.0</div></div>
      <div class="mc"><div class="ml">Drawdown max</div><div class="mv ${maxDD<10?'g':maxDD<15?'':'r'}">${maxDD.toFixed(1)}%</div><div class="ms">Limite: ${curP.dd}%</div></div>
      <div class="mc"><div class="ml">R/R medio</div><div class="mv ${avgRR>=2?'g':''}">${avgRR>0?avgRR.toFixed(2):'—'}</div><div class="ms">Target ≥ 2.0</div></div>
    </div>

    <!-- Rule health -->
    <div class="card g1">
      <div class="card-hd"><div class="card-title">Salute operativa</div></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        ${[
          {lbl:'Win rate',v:wr,t:60,u:'%',inv:false},
          {lbl:'R/R medio',v:avgRR,t:2,u:'',inv:false},
          {lbl:'Drawdown max',v:maxDD,t:curP.dd,u:'%',inv:true},
          {lbl:'Checklist media',v:parseFloat(avgCk.toFixed(1)),t:5,u:'/6',inv:false},
        ].map(({lbl,v,t,u,inv})=>{
          const ok=inv?v<=t:v>=t;
          const pct=Math.min(100,inv?(v<=t?100:Math.round(t/v*100)):Math.round(v/t*100));
          return`<div>
            <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px">
              <span style="color:var(--t2)">${lbl}</span>
              <span class="mono" style="color:${ok?'var(--green)':'var(--red)'}">${v.toFixed(1)}${u} <span style="color:var(--t3)">/ ${t}${u}</span></span>
            </div>
            <div class="pw"><div class="pb ${ok?'pb-g':'pb-r'}" style="width:${pct}%"></div></div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="g2">
      <div class="card">
        <div class="card-hd"><div class="card-title">Curva capitale</div></div>
        <div class="cw" style="height:200px"><canvas id="st-eq"></canvas></div>
      </div>
      <div class="card">
        <div class="card-hd"><div class="card-title">Drawdown nel tempo</div></div>
        <div class="cw" style="height:200px"><canvas id="st-dd"></canvas></div>
      </div>
    </div>

    <div class="g2">
      <div class="card">
        <div class="card-hd"><div class="card-title">P/L mensile</div></div>
        <div class="cw" style="height:180px"><canvas id="st-m"></canvas></div>
      </div>
      <div class="card">
        <div class="card-hd"><div class="card-title">Per fase Wyckoff</div></div>
        ${wyck.map(w=>`<div style="margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <div style="display:flex;align-items:center;gap:7px">
              <span style="font-size:13px;font-weight:500">${w.ph}</span>
              <span style="font-size:11px;color:var(--t3)">${w.n} op · ${w.wr}% WR</span>
            </div>
            <span class="mono" style="font-size:12.5px;color:${w.pnl>=0?'var(--green)':'var(--red)'}">${w.pnl>=0?'+':''}${fmt(w.pnl)}</span>
          </div>
          <div class="pw"><div class="pb" style="width:${w.n>0?Math.min(100,Math.abs(w.pnl)/150*100):0}%;background:${w.pnl>=0?'var(--green)':'var(--red)'}"></div></div>
        </div>`).join('')}
      </div>
    </div>

    <div class="card">
      <div class="card-hd"><div class="card-title">Dettaglio</div></div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
        ${[
          {l:'Trade totali',v:trades.length},
          {l:'Vincenti',v:wins.length,c:'var(--green)'},
          {l:'Perdenti',v:losses.length,c:'var(--red)'},
          {l:'Media vincita',v:fmt(avgW),c:'var(--green)'},
          {l:'Media perdita',v:fmt(avgL),c:'var(--red)'},
          {l:'P/L totale',v:fmt(totalPnL),c:totalPnL>=0?'var(--green)':'var(--red)'},
        ].map(({l,v,c})=>`<div style="background:var(--s2);border:1px solid var(--b1);border-radius:8px;padding:11px 13px">
          <div style="font-size:11px;color:var(--t3);margin-bottom:3px">${l}</div>
          <div class="mono" style="font-size:14px;font-weight:500;color:${c||'var(--t1)'}">${v}</div>
        </div>`).join('')}
      </div>
    </div>
  </div>`;

  const lineOpts=(color,inv)=>({responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{...TT,callbacks:{label:c=>(inv?c.parsed.y.toFixed(2)+'%':'€ '+Math.round(c.parsed.y).toLocaleString('it-IT'))}}},scales:{x:{ticks:TX,grid:{color:GR}},y:{reverse:inv,ticks:{...TX,callback:v=>inv?v+'%':'€'+(v/1000).toFixed(0)+'k'},grid:{color:GR}}}});

  mkChart('st-eq',{type:'line',data:{labels,datasets:[
    {label:'Capitale',data:eqD,borderColor:'#c9a84c',borderWidth:2,pointRadius:eqD.length>15?0:2,tension:.35,fill:true,backgroundColor:ctx=>{const g=ctx.chart.ctx.createLinearGradient(0,0,0,200);g.addColorStop(0,'rgba(201,168,76,.2)');g.addColorStop(1,'rgba(201,168,76,0)');return g;}},
    {label:'Target',data:labels.map(()=>35000),borderColor:'#4caf7d',borderWidth:1,borderDash:[5,4],pointRadius:0,fill:false},
  ]},options:lineOpts('#c9a84c',false)});

  mkChart('st-dd',{type:'line',data:{labels,datasets:[{label:'DD',data:ddD,borderColor:'#e05c5c',borderWidth:2,pointRadius:ddD.length>15?0:2,tension:.35,fill:true,backgroundColor:ctx=>{const g=ctx.chart.ctx.createLinearGradient(0,0,0,200);g.addColorStop(0,'rgba(224,92,92,.2)');g.addColorStop(1,'rgba(224,92,92,0)');return g;}}]},options:lineOpts('#e05c5c',true)});

  mkChart('st-m',{type:'bar',data:{labels:monthly.map(m=>m.m),datasets:[{data:monthly.map(m=>m.pnl),backgroundColor:monthly.map(m=>m.pnl>=0?'rgba(76,175,125,.7)':'rgba(224,92,92,.7)'),borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{...TT,callbacks:{label:c=>'€ '+c.parsed.y}}},scales:{x:{ticks:TX,grid:{display:false}},y:{ticks:{...TX,callback:v=>'€'+v},grid:{color:GR}}}}});
};

PAGES.scalata=function(){
  const trades=DB.get('trades')||[];
  const S=DB.get('settings')||{initialCapital:3500,targetCapital:35000};
  const INIT=S.initialCapital||3500, TARGET=S.targetCapital||35000;
  const totalPnL=trades.reduce((s,t)=>s+t.pnl,0);
  const equity=INIT+totalPnL;
  const overall=Math.min(100,Math.max(0,Math.round((equity-INIT)/(TARGET-INIT)*100)));
  const cm=new Date().getMonth();
  const curP=PLAN[cm]||PLAN[0];
  const cmOps=trades.filter(t=>new Date(t.date).getMonth()===cm);
  const cmPnL=cmOps.reduce((s,t)=>s+t.pnl,0);
  const prevEq=equity-cmPnL;
  const cmTarget=prevEq*(curP.t/100);
  const cmPct=cmTarget>0?Math.min(100,Math.round(cmPnL/cmTarget*100)):0;
  const wins=trades.filter(t=>t.pnl>0).length;
  const wr=trades.length?Math.round(wins/trades.length*100):0;
  const sOps=[...trades].sort((a,b)=>a.date.localeCompare(b.date));
  let peak=INIT,eq2=INIT,maxDD=0;
  sOps.forEach(t=>{eq2+=t.pnl;if(eq2>peak)peak=eq2;const dd=peak>0?(peak-eq2)/peak*100:0;if(dd>maxDD)maxDD=dd;});

  // Equity series
  let eq3=INIT;
  const eqD=[INIT],eqL=['Start'];
  sOps.forEach(t=>{eq3+=t.pnl;eqD.push(Math.round(eq3));eqL.push(t.date.slice(5));});

  const PCOL={Apprendimento:'var(--amber)',Consolidamento:'var(--blue)',Scalata:'var(--green)',Obiettivo:'var(--gold2)'};

          <div style="font-size:11px;color:var(--t3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.6px">Progresso totale</div>

        </div>
        <div style="text-align:right">
          <div style="font-size:11px;color:var(--t3);margin-bottom:4px">Obiettivo</div>
          <div class="mono" style="font-size:22px;color:var(--green)">${fmt(TARGET)}</div>
        </div>
      </div>
      <div class="pw h8" style="margin-bottom:7px"><div class="pb pb-au" style="width:${overall}%"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--t3)">
        <span>${overall}% completato</span>
        <span>Mancano ${fmt(Math.max(0,TARGET-equity))}</span>
      </div>

    <div class="g4">

      <div class="mc"><div class="ml">P/L mese</div><div class="mv ${cmPnL>=0?'g':'r'}">${cmPnL>=0?'+':''}${fmt(cmPnL)}</div><div class="ms">Target: +${fmt(cmTarget)}</div></div>
      <div class="mc"><div class="ml">Win rate</div><div class="mv ${wr>=60?'g':''}">${wr>0?wr+'%':'—'}</div></div>
      <div class="mc"><div class="ml">Drawdown max</div><div class="mv ${maxDD<10?'g':maxDD<15?'':'r'}">${maxDD.toFixed(1)}%</div><div class="ms">Limite: ${curP.dd}%</div></div>

    <div class="card g1">

                <span>${fmtN(p.qty,4)} × ${fmt(p.currentPrice,2)}</span>

function saveAsset(){
  const n=document.getElementById('an').value,t=document.getElementById('at').value.toUpperCase(),ty=document.getElementById('aty').value;
  const q=parseFloat(document.getElementById('aq').value)||0,b=parseFloat(document.getElementById('ab').value)||0,c=parseFloat(document.getElementById('ac').value)||0;

  DB.push('portfolio',{id:uid(),name:n,ticker:t,type:ty,qty:q,buyPrice:b,currentPrice:c});

function editAsset(id){
  const p=(DB.get('portfolio')||[]).find(x=>x.id===id); if(!p) return;
  openModal(`<div class="modal"><div class="modal-title">Modifica ${p.ticker}</div>
    <div class="fg">
      <div><label class="fl">Prezzo corrente ($)</label><input type="number" id="ep" class="fi" value="${p.currentPrice}" step="0.01"></div>

function saveEdit(id){
  const P=DB.get('portfolio')||[], i=P.findIndex(p=>p.id===id); if(i<0)return;

}
function delAsset(id){ if(confirm('Eliminare?')){ DB.del('portfolio',id); nav('portfolio'); } }

PAGES.accumulo=function(){
  const acc=DB.get('accumulo')||[];

  const cD=sorted.map(a=>{run+=a.amount;return{d:a.date.slice(5),v:Math.round(run)};});

  document.getElementById('content').innerHTML=`<div class="page">
    <div class="g4">

      </div>
      <div class="card">
        <div class="card-hd"><div class="card-title">Per asset</div></div>
        ${byA.length?byA.map(a=>{const pct=total>0?Math.round(a.total/total*100):0;return`<div style="margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
            <span style="font-weight:500">${a.asset}</span>
            <span class="mono">${fmt(a.total)} <span style="color:var(--t3)">(${pct}%)</span></span>

        </div>`;}).join(''):`<div class="empty"><div class="empty-s">Nessun dato</div></div>`}

    </div>

      <div class="card-hd"><div class="card-title">Simulatore PAC</div></div>
      <div class="tw"><table>
        <thead><tr><th>Mensile</th><th>1 anno</th><th>3 anni</th><th>5 anni</th><th>10 anni</th></tr></thead>
        <tbody>${pac.map(r=>`<tr>
          <td class="tm" style="color:var(--gold2);font-weight:500">${fmt(r.m)}/mese</td>
          ${r.p.map(v=>`<td class="tm" style="color:var(--green)">${fmt(v)}</td>`).join('')}
        </tr>`).join('')}</tbody>
      </table></div>
      <div style="font-size:11px;color:var(--t3);margin-top:8px">*Rendimento 7% annuo composto — non è una garanzia.</div>
    </div>

    <div class="card">
      <div class="card-hd"><div class="card-title">Storico versamenti</div><button class="btn btn-gold btn-sm" onclick="addAcc()">+ Aggiungi</button></div>
      <div class="tw"><table>
        <thead><tr><th>Data</th><th>Asset</th><th>Importo</th><th>Note</th><th></th></tr></thead>
        <tbody>${[...acc].sort((a,b)=>b.date.localeCompare(a.date)).map(a=>`<tr>

          <td class="tm" style="color:var(--green)">+${fmt(a.amount)}</td>

    </div>
  </div>`;

  if(cD.length) mkChart('acc-c',{type:'line',data:{labels:cD.map(d=>d.d),datasets:[{label:'Accumulato',data:cD.map(d=>d.v),borderColor:'#c9a84c',borderWidth:2,pointRadius:cD.length>20?0:3,tension:.4,fill:true,backgroundColor:ctx=>{const g=ctx.chart.ctx.createLinearGradient(0,0,0,210);g.addColorStop(0,'rgba(201,168,76,.22)');g.addColorStop(1,'rgba(201,168,76,0)');return g;}}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{...TT,callbacks:{label:c=>'€ '+c.parsed.y.toLocaleString('it-IT')}}},scales:{x:{ticks:TX,grid:{color:GR}},y:{ticks:{...TX,callback:v=>'€'+(v/1000).toFixed(1)+'k'},grid:{color:GR}}}}});

          return`<div style="padding:14px 16px;background:var(--s2);border:1px solid var(--b1);border-radius:10px">

          </div>`;
        }).join('')}

function calcComp(){
  const C=parseFloat(document.getElementById('ci')?.value)||0;
  const M=parseFloat(document.getElementById('vm')?.value)||0;
  const r=parseFloat(document.getElementById('ra')?.value)||0;
  const Y=parseFloat(document.getElementById('an')?.value)||0;
  const f=parseInt(document.getElementById('fr')?.value)||12;
  const rate=r/100/f;
  const n=Y*f;
  const fv=C*Math.pow(1+rate,n)+M*(Math.pow(1+rate,n)-1)/rate;
  const invested=C+M*n;
  const interest=fv-invested;
  const el=document.getElementById('comp-result');
  if(!el)return;
  el.innerHTML=[
    {l:'Capitale finale',v:fmt(fv),c:'var(--gold2)'},
    {l:'Versato totale',v:fmt(invested),c:'var(--t1)'},
    {l:'Interessi maturati',v:fmt(interest),c:'var(--green)'},
  ].map(({l,v,c})=>`<div style="background:var(--s2);border:1px solid var(--b1);border-radius:8px;padding:12px">
    <div style="font-size:11px;color:var(--t3);margin-bottom:4px">${l}</div>
    <div class="mono" style="font-size:15px;font-weight:500;color:${c}">${v}</div>
  </div>`).join('');
  // Chart
  const labels=[],capData=[],totData=[];
  for(let y=0;y<=Y;y++){
    const ni=y*f;
    const fvi=C*Math.pow(1+rate,ni)+M*(Math.pow(1+rate,ni)-1)/rate;
    labels.push('Anno '+y);
    capData.push(Math.round(C+M*ni));
    totData.push(Math.round(fvi));
  }
  mkChart('comp-chart',{type:'line',data:{labels,datasets:[
    {label:'Capitale investito',data:capData,borderColor:'#5b8dee',borderWidth:1.5,pointRadius:0,fill:true,backgroundColor:'rgba(91,141,238,.1)'},
    {label:'Valore finale',data:totData,borderColor:'#c9a84c',borderWidth:2,pointRadius:0,fill:true,backgroundColor:'rgba(201,168,76,.12)'},
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#9b968f',font:{size:11},padding:10,usePointStyle:true}},tooltip:{backgroundColor:'#181818',borderColor:'#2a2a2a',borderWidth:1,callbacks:{label:c=>'€ '+Math.round(c.parsed.y).toLocaleString('it-IT')}}},scales:{x:{ticks:{font:{size:10},color:'#575350'},grid:{color:'rgba(42,42,42,.5)'}},y:{ticks:{font:{size:10},color:'#575350',callback:v=>'€'+(v/1000).toFixed(0)+'k'},grid:{color:'rgba(42,42,42,.5)'}}}}}); 
}

const FX={EUR:1,USD:1.08,GBP:0.86,CHF:0.97,JPY:163.5,BTC:0.0000155};
function calcCurrency(){
  const a=parseFloat(document.getElementById('cv-amount')?.value)||0;
  const from=document.getElementById('cv-from')?.value||'EUR';
  const to=document.getElementById('cv-to')?.value||'USD';
  const result=a/FX[from]*FX[to];
  const el=document.getElementById('cv-val');
  if(el)el.textContent=to==='BTC'?result.toFixed(8):result.toLocaleString('it-IT',{maximumFractionDigits:2})+' '+to;
}

function calcTax(){
  const gross=parseFloat(document.getElementById('tax-gross')?.value)||0;
  const rate=parseFloat(document.getElementById('tax-rate')?.value)||26;
  const tax=gross*rate/100;
  const net=gross-tax;
  const el=document.getElementById('tax-result');
  if(!el||!gross)return;
  el.innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
    ${[{l:'Lordo',v:fmt(gross),c:'var(--t1)'},{l:'Tasse ('+rate+'%)',v:fmt(tax),c:'var(--red)'},{l:'Netto',v:fmt(net),c:'var(--green)'}]
    .map(({l,v,c})=>`<div style="background:var(--s2);border:1px solid var(--b1);border-radius:8px;padding:10px 12px">
      <div style="font-size:11px;color:var(--t3);margin-bottom:3px">${l}</div>
      <div class="mono" style="font-size:14px;font-weight:500;color:${c}">${v}</div>
    </div>`).join('')}
  </div>`;
}

  diario:{title:'Diario finanziario',sub:'Note, riflessioni e psicologia del trading'},
  obiettivi:{title:'Obiettivi',sub:'Traguardi finanziari e progress tracking'},
};
const _origNav=nav;
nav=function(page){
  const meta=PAGE_META_EXT[page];
  if(meta){
    currentPage=page;
    document.querySelectorAll('.nav-link').forEach(el=>el.classList.toggle('active',el.dataset.page===page));
    document.querySelectorAll('.bn-item').forEach(el=>el.classList.toggle('active',el.dataset.page===page));
    document.getElementById('nav-page-title').textContent=meta.title;
    document.getElementById('topbar-actions').innerHTML='';
    document.getElementById('content').innerHTML='';
    PAGES[page]();
  } else {
    _origNav(page);
  }
};
